[project]
name = "vista"
version = "0.1.0"
description = "VISTA: Visual Intelligence & Spatial Technology Architecture (OCR MVP + object detection)"
readme = "README.md"
requires-python = ">=3.11"   # PROVISIONAL: confirm against the installed Python on the X270
dependencies = ["fastapi", "uvicorn", "pillow", "python-multipart"]   # versions unpinned until verified on the X270

[project.optional-dependencies]
ocr = ["rapidocr-onnxruntime"]
detection = ["onnxruntime", "numpy"]   # model file installed separately: docs/DETECTION.md

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
  "requires_model: needs downloaded model weights or a real OCR/detection engine (excluded from normal runs)",
  "requires_network: needs network or API keys (excluded from normal runs)",
]
addopts = "-m 'not requires_model and not requires_network'"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
